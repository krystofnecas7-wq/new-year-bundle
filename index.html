<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b1a" />
    <meta name="description" content="Jedna noc. Celá planeta. 31 půlnocí. New Year Bundle by All Around Value." />
    <title>New Year Bundle</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Demo lišta, jen pro testování. -->
    <div id="demo-bar" class="demo-bar" hidden></div>

    <header class="topbar">
      <button class="brand" data-act="go" data-to="intro" aria-label="New Year Bundle">
        <span class="brand-mark">NYB</span>
        <span class="brand-name">New Year Bundle</span>
      </button>
      <div class="topbar-right">
        <button class="progress-badge js-progress" data-act="go" data-to="profile" aria-label="Postup"></button>
        <button class="lang-pill js-lang" data-act="lang" aria-label="Jazyk"></button>
        <button class="icon-btn" data-act="menu" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- Menu -->
    <div id="menu" class="menu" hidden>
      <div class="menu-sheet" id="menu-sheet"></div>
    </div>

    <main class="app">
      <section id="screen-intro" class="screen" hidden></section>
      <section id="screen-rules" class="screen" hidden></section>
      <section id="screen-zone" class="screen" hidden></section>
      <section id="screen-map" class="screen" hidden></section>
      <section id="screen-profile" class="screen" hidden></section>
      <section id="screen-about" class="screen" hidden></section>
      <section id="screen-end" class="screen" hidden></section>
    </main>

    <!-- Velké odpočítávání 10 9 8 přes celý displej. -->
    <div id="big-countdown" class="big-cd" hidden></div>

    <div id="toast" class="toast" hidden></div>

    <footer class="footer">
      <p class="js-by">by All Around Value</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
