<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- New Year Bundle, ikona: zeměkoule jako ciferník, minuta do půlnoci. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1c52"/>
      <stop offset="1" stop-color="#0b0b1a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5d8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.54" r="0.5">
      <stop offset="0" stop-color="#ff5d8f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5d8f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="256" cy="278" r="148"/></clipPath>
  </defs>

  <g id="art">
    <rect id="bgrect" width="512" height="512" rx="112" fill="url(#bg)"/>
    <circle cx="256" cy="278" r="230" fill="url(#glow)"/>

    <!-- zeměkoule -->
    <circle cx="256" cy="278" r="148" fill="url(#warm)"/>
    <g clip-path="url(#globe)" fill="none" stroke="#2a0010" stroke-opacity="0.32" stroke-width="9" stroke-linecap="round">
      <ellipse cx="256" cy="278" rx="64" ry="148"/>
      <ellipse cx="256" cy="278" rx="118" ry="148"/>
      <line x1="100" y1="278" x2="412" y2="278"/>
      <path d="M118 206 Q256 236 394 206"/>
      <path d="M118 350 Q256 320 394 350"/>
    </g>

    <!-- ciferník: tečky na 12, 3, 6, 9 -->
    <g fill="#ffd166">
      <circle cx="256" cy="148" r="9"/>
      <circle cx="386" cy="278" r="7"/>
      <circle cx="256" cy="408" r="7"/>
      <circle cx="126" cy="278" r="7"/>
    </g>

    <!-- ručičky: 23:59, minuta do půlnoci -->
    <g stroke-linecap="round">
      <line x1="256" y1="278" x2="256" y2="196" stroke="#0b0b1a" stroke-width="26"/>
      <line x1="256" y1="278" x2="256" y2="196" stroke="#ffd166" stroke-width="16"/>
      <line x1="256" y1="278" x2="243" y2="160" stroke="#0b0b1a" stroke-width="18"/>
      <line x1="256" y1="278" x2="243" y2="160" stroke="#f4f4ff" stroke-width="9"/>
    </g>
    <circle cx="256" cy="278" r="17" fill="#ffd166" stroke="#0b0b1a" stroke-width="6"/>

    <!-- jiskry z ohňostroje -->
    <path d="M404 92 L413 120 L441 129 L413 138 L404 166 L395 138 L367 129 L395 120 Z" fill="#ffd166"/>
    <path d="M110 108 L116 124 L132 130 L116 136 L110 152 L104 136 L88 130 L104 124 Z" fill="#ff5d8f"/>
    <circle cx="452" cy="196" r="7" fill="#ff8a3d"/>
    <circle cx="70" cy="200" r="6" fill="#ffd166"/>
    <circle cx="352" cy="62" r="5" fill="#f4f4ff"/>
  </g>
</svg>
